<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brand Foundry</title>
    <script>
      // SPA fallback for GitHub Pages: rewrite the path into a query
      // string that index.html can read and replaceState back into a route.
      (function () {
        var segmentsToKeep = 1; // "/BFS"
        var l = window.location;
        var pathname = l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/';
        l.replace(
          l.protocol + '//' + l.host + pathname + '?p=/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
