  <body>
    <div id="root"></div>
    <script>
      // SPA 404 fallback receiver: convert ?p=/path back into a real path.
      (function () {
        var q = window.location.search;
        if (q && q.indexOf('?p=/') === 0) {
          var path = q.slice(3).split('&')[0].replace(/~and~/g, '&');
          var search = '';
          var ampQ = q.match(/&q=([^&]*)/);
          if (ampQ) search = '?' + ampQ[1].replace(/~and~/g, '&');
          window.history.replaceState(
            null,
            null,
            window.location.pathname.replace(/\/$/, '') + path + search + window.location.hash
          );
        }
      })();
    </script>
